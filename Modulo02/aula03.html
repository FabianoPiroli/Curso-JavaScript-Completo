<html>
    <script>
        // Arrays

        var nomes = ["Fabiano", "João", "Maria", "José"];
        console.log(nomes[0]); // Fabiano
        
        nomes[0] = "Fabiano Piroli"; // altera o valor do índice 0 do array
        console.log(nomes[0]); // Fabiano Piroli

        nomes.push("Ana"); // adiciona um novo elemento no final do array
        console.log(nomes); // ["Fabiano Piroli", "João", "Maria", "José", "Ana"]
    </script>
</html>

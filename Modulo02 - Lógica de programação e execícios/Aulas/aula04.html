<html>
    <script>
        // Condições

        var numero = 10;
        var nome = "Fabiano";

        if (nome === "Fabiano") {
            console.log("O nome é Fabiano");
        } else {
            console.log("O nome não é Fabiano");
        }

        if (numero > 5) {
            console.log("O número é maior que 5");
        } else if (numero < 5) {
            console.log("O número é menor que 5");
        } else {
            console.log("O número é igual a 5");
        }

        if (nome !== "Fabiano") {
            console.log("O nome não é Fabiano");
        }

        if (numero >= 10 && nome === "Fabiano") {
            console.log("O número é maior ou igual a 10 e o nome é Fabiano");
        }
    </script>
</html>
